<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTM 2026 — Configuration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #f7f6f2;
            --color-surface: #f9f8f5;
            --color-divider: #dcd9d5;
            --color-border: #d4d1ca;
            --color-text: #28251d;
            --color-text-muted: #6b6965;
            --color-primary: #01696f;
            --color-primary-hover: #0c4e54;
            --color-success: #437a22;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --font-body: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); line-height: 1.5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .wrapper { width: 100%; max-width: 520px; }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo-icon { font-size: 48px; margin-bottom: 12px; }
        .logo h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
        .logo p { color: var(--color-text-muted); font-size: 15px; margin-top: 4px; }
        .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 36px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        .field input { width: 100%; padding: 11px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: inherit; font-size: 15px; background: white; color: var(--color-text); transition: 150ms; }
        .field input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(1,105,111,0.1); }
        .btn { width: 100%; padding: 13px; border-radius: var(--radius-md); font-weight: 700; font-size: 15px; cursor: pointer; border: none; transition: 150ms; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--color-primary); color: white; }
        .btn-primary:hover { background: var(--color-primary-hover); }
        .existing-config { margin-top: 24px; padding: 16px; background: rgba(1,105,111,0.06); border: 1px solid rgba(1,105,111,0.2); border-radius: var(--radius-md); display: none; }
        .existing-config h3 { font-size: 13px; font-weight: 700; color: var(--color-primary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
        .existing-info { font-size: 14px; margin-bottom: 4px; }
        .existing-info strong { font-weight: 600; }
        .resume-btn { margin-top: 12px; width: 100%; padding: 10px; border-radius: var(--radius-md); font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid var(--color-primary); background: white; color: var(--color-primary); transition: 150ms; }
        .resume-btn:hover { background: rgba(1,105,111,0.06); }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--color-text-muted); font-size: 13px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-divider); }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="logo">
            <div class="logo-icon">⚽</div>
            <h1>Football Tournament Manager</h1>
            <p>Gestionnaire de tournoi 2026 &mdash; 16 équipes</p>
        </div>

        <div class="card">
            <div id="existingConfig" class="existing-config">
                <h3>⚡ Tournoi en cours</h3>
                <p class="existing-info"><strong>Nom :</strong> <span id="existingName"></span></p>
                <p class="existing-info"><strong>Date :</strong> <span id="existingDate"></span></p>
                <p class="existing-info"><strong>Équipes :</strong> <span id="existingTeams"></span> / 16</p>
                <button class="resume-btn" onclick="resumeTournament()">▶ Reprendre ce tournoi</button>
            </div>

            <div id="dividerEl" class="divider" style="display:none">ou créer un nouveau tournoi</div>

            <h2 class="card-title">Nouveau tournoi</h2>

            <form id="configForm">
                <div class="field">
                    <label for="tournamentName">Nom du tournoi *</label>
                    <input type="text" id="tournamentName" placeholder="ex : Coupe de printemps 2026" maxlength="80" required>
                </div>
                <div class="field">
                    <label for="tournamentDate">Date du tournoi *</label>
                    <input type="date" id="tournamentDate" required>
                </div>
                <div class="field">
                    <label for="tournamentLocation">Lieu (optionnel)</label>
                    <input type="text" id="tournamentLocation" placeholder="ex : Stade municipal de Metz" maxlength="80">
                </div>
                <button type="submit" class="btn btn-primary">➡ Configurer et ajouter les équipes</button>
            </form>
        </div>
    </div>

    <script>
        // Clé localStorage utilisée par TOUTES les pages src/
        const CONFIG_KEY = 'tournamentConfig';
        const TEAMS_KEY  = 'teams';

        // Pré-remplir la date avec aujourd'hui
        document.getElementById('tournamentDate').valueAsDate = new Date();

        // Vérifier si un tournoi existe déjà
        function checkExisting() {
            const config = JSON.parse(localStorage.getItem(CONFIG_KEY));
            const teams  = JSON.parse(localStorage.getItem(TEAMS_KEY)) || [];
            if (config && config.name) {
                document.getElementById('existingConfig').style.display = 'block';
                document.getElementById('dividerEl').style.display = 'flex';
                document.getElementById('existingName').textContent = config.name;
                document.getElementById('existingDate').textContent = config.date
                    ? new Date(config.date).toLocaleDateString('fr-FR') : '—';
                document.getElementById('existingTeams').textContent = teams.length;
            }
        }

        function resumeTournament() {
            const teams = JSON.parse(localStorage.getItem(TEAMS_KEY)) || [];
            const groups = JSON.parse(localStorage.getItem('groups'));
            const matches = JSON.parse(localStorage.getItem('matches'));
            // Rediriger vers la bonne étape
            if (matches && matches.length > 0) {
                window.location.href = 'src/matches.html';
            } else if (groups && groups.A && groups.A.length > 0) {
                window.location.href = 'src/groups.html';
            } else {
                window.location.href = 'src/teams.html';
            }
        }

        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name     = document.getElementById('tournamentName').value.trim();
            const date     = document.getElementById('tournamentDate').value;
            const location = document.getElementById('tournamentLocation').value.trim();

            // Sauvegarder dans tournamentConfig (clé attendue par toutes les pages src/)
            const config = { name, date, location, status: 'NOUVEAU', createdAt: new Date().toISOString() };
            localStorage.setItem(CONFIG_KEY, JSON.stringify(config));

            // Réinitialiser les équipes et poules pour un nouveau tournoi
            localStorage.removeItem(TEAMS_KEY);
            localStorage.removeItem('groups');
            localStorage.removeItem('matches');
            localStorage.removeItem('groupRankings');
            localStorage.removeItem('p2Matches');

            // Rediriger vers la gestion des équipes
            window.location.href = 'src/teams.html';
        });

        checkExisting();
    </script>
</body>
</html>
