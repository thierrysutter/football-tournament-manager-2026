<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phases Finales - Football Tournament Manager 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
    <style>
        /* NEXUS STYLE BASE */
        :root, [data-theme="light"] {
            --color-bg: #f7f6f2;
            --color-surface: #f9f8f5;
            --color-divider: #dcd9d5;
            --color-border: #d4d1ca;
            --color-text: #28251d;
            --color-text-muted: #6b6965;
            --color-primary: #01696f;
            --color-primary-hover: #0c4e54;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --font-body: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        header { margin-bottom: 32px; }
        .page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
        .nav-links { display: flex; gap: 8px; list-style: none; margin-top: 16px; }
        .nav-links a { text-decoration: none; color: var(--color-text-muted); padding: 6px 12px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; transition: 150ms; }
        .nav-links a:hover { background: var(--color-divider); color: var(--color-text); }
        .nav-links a.active { background: var(--color-primary); color: white; }

        .tabs-nav { display: flex; gap: 12px; margin-bottom: 32px; border-bottom: 1px solid var(--color-divider); padding-bottom: 1px; }
        .tab-btn { padding: 12px 24px; background: none; border: none; font-weight: 600; color: var(--color-text-muted); cursor: pointer; position: relative; }
        .tab-btn.active { color: var(--color-primary); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: var(--color-primary); border-radius: 3px 3px 0 0; }

        .bracket-view { display: none; }
        .bracket-view.active { display: block; }

        .bracket-grid { display: flex; gap: 40px; overflow-x: auto; padding-bottom: 20px; }
        .bracket-column { flex: 0 0 280px; display: flex; flex-direction: column; gap: 24px; }
        .column-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 12px; letter-spacing: 0.05em; }

        .match-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .match-header { font-size: 10px; font-weight: 700; padding: 4px 12px; background: var(--color-divider); color: var(--color-text-muted); border-bottom: 1px solid var(--color-border); }
        .match-team { display: flex; align-items: center; padding: 10px 12px; gap: 8px; font-size: 13px; }
        .team-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .team-score { width: 40px; text-align: center; }
        .team-score input { width: 100%; text-align: center; padding: 4px; border: 1px solid var(--color-border); border-radius: 4px; font-weight: 700; background: var(--color-bg); }
        .team-winner { font-weight: 700; color: var(--color-primary); }
        
        .footer-actions { margin-top: 40px; display: flex; justify-content: space-between; }
        .btn { padding: 10px 20px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; border: none; font-size: 14px; transition: 150ms; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--color-primary); color: white; }
        .btn-secondary { background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="page-title">Phases Finales</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="football-tournament-manager.html">Dashboard</a></li>
                    <li><a href="teams.html">Équipes</a></li>
                    <li><a href="groups.html">Poules</a></li>
                    <li><a href="matches.html">Résultats</a></li>
                    <li><a href="standings.html">Classements</a></li>
                    <li><a href="brackets.html" class="active">Brackets</a></li>
                </ul>
            </nav>
        </header>

        <nav class="tabs-nav">
            <button class="tab-btn active" id="tab-p" onclick="switchTab('principal')">Tableau Principal (1-8)</button>
            <button class="tab-btn" id="tab-c" onclick="switchTab('consolant')">Tableau Consolant (9-16)</button>
        </nav>

        <div id="view-principal" class="bracket-view active">
            <div class="bracket-grid">
                <div class="bracket-column">
                    <div class="column-title">Quarts de finale</div>
                    <div id="qf-p-container"></div>
                </div>
                <div class="bracket-column">
                    <div class="column-title">Demi-finales</div>
                    <div id="sf-p-container"></div>
                </div>
                <div class="bracket-column">
                    <div class="column-title">Finales</div>
                    <div id="f-p-container"></div>
                </div>
            </div>
        </div>

        <div id="view-consolant" class="bracket-view">
            <div class="bracket-grid">
                <div class="bracket-column">
                    <div class="column-title">Quarts de finale</div>
                    <div id="qf-c-container"></div>
                </div>
                <div class="bracket-column">
                    <div class="column-title">Demi-finales</div>
                    <div id="sf-c-container"></div>
                </div>
                <div class="bracket-column">
                    <div class="column-title">Finales</div>
                    <div id="f-c-container"></div>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" onclick="window.location.href='standings.html'">← Retour aux classements</button>
            <button class="btn btn-primary" onclick="finishTournament()">Clôturer le tournoi</button>
        </div>
    </div>

    <script>
        let teams = [];
        let p2Matches = [];
        const rankings = JSON.parse(localStorage.getItem('groupRankings')) || {};

        document.addEventListener('DOMContentLoaded', () => {
            teams = JSON.parse(localStorage.getItem('teams')) || [];
            p2Matches = JSON.parse(localStorage.getItem('p2Matches')) || [];
            if (p2Matches.length === 0) initBrackets();
            renderAll();
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + (tab==='principal'?'p':'c')).classList.add('active');
            document.querySelectorAll('.bracket-view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + tab).classList.add('active');
        }

        function initBrackets() {
            p2Matches = [];
            const pQF = [
                {id:'QF1', t1:rankings.A[0], t2:rankings.B[1], l:'1A vs 2B'},
                {id:'QF2', t1:rankings.C[0], t2:rankings.D[1], l:'1C vs 2D'},
                {id:'QF3', t1:rankings.B[0], t2:rankings.A[1], l:'1B vs 2A'},
                {id:'QF4', t1:rankings.D[0], t2:rankings.C[1], l:'1D vs 2C'}
            ];
            const cQF = [
                {id:'QF5', t1:rankings.A[2], t2:rankings.B[3], l:'3A vs 4B'},
                {id:'QF6', t1:rankings.C[2], t2:rankings.D[3], l:'3C vs 4D'},
                {id:'QF7', t1:rankings.B[2], t2:rankings.A[3], l:'3B vs 4A'},
                {id:'QF8', t1:rankings.D[2], t2:rankings.C[3], l:'3D vs 4C'}
            ];
            pQF.concat(cQF).forEach(q => {
                p2Matches.push({id:q.id, team1Id:q.t1, team2Id:q.t2, score1:null, score2:null, completed:false, label:q.l});
            });
            ['SF1','SF2','SF3','SF4','SF5','SF6','SF7','SF8','F1','F2','F3','F4','F5','F6','F7','F8'].forEach(id => {
                p2Matches.push({id, team1Id:null, team2Id:null, score1:null, score2:null, completed:false});
            });
            save();
        }

        function save() { localStorage.setItem('p2Matches', JSON.stringify(p2Matches)); }

        function updateScore(id, idx, val) {
            const m = p2Matches.find(m => m.id === id);
            const s = val === '' ? null : parseInt(val);
            if (idx === 1) m.score1 = s; else m.score2 = s;
            m.completed = (m.score1 !== null && m.score2 !== null && m.score1 !== m.score2);
            if (m.completed) {
                m.winnerId = m.score1 > m.score2 ? m.team1Id : m.team2Id;
                m.loserId = m.score1 > m.score2 ? m.team2Id : m.team1Id;
                updateProgression(m);
            }
            save(); renderAll();
        }

        function updateProgression(m) {
            const t = (id, s, team) => { const target = p2Matches.find(x => x.id === id); if (s === 1) target.team1Id = team; else target.team2Id = team; };
            if (m.id === 'QF1') { t('SF1', 1, m.winnerId); t('SF3', 1, m.loserId); }
            if (m.id === 'QF2') { t('SF1', 2, m.winnerId); t('SF3', 2, m.loserId); }
            if (m.id === 'QF3') { t('SF2', 1, m.winnerId); t('SF4', 1, m.loserId); }
            if (m.id === 'QF4') { t('SF2', 2, m.winnerId); t('SF4', 2, m.loserId); }
            if (m.id === 'QF5') { t('SF5', 1, m.winnerId); t('SF7', 1, m.loserId); }
            if (m.id === 'QF6') { t('SF5', 2, m.winnerId); t('SF7', 2, m.loserId); }
            if (m.id === 'QF7') { t('SF6', 1, m.winnerId); t('SF8', 1, m.loserId); }
            if (m.id === 'QF8') { t('SF6', 2, m.winnerId); t('SF8', 2, m.loserId); }
            if (m.id.startsWith('SF')) {
                const map = { SF1:['F1','F2'], SF2:['F1','F2'], SF3:['F3','F4'], SF4:['F3','F4'], SF5:['F5','F6'], SF6:['F5','F6'], SF7:['F7','F8'], SF8:['F7','F8'] };
                const targets = map[m.id];
                const slot = (m.id==='SF1'||m.id==='SF3'||m.id==='SF5'||m.id==='SF7') ? 1 : 2;
                t(targets[0], slot, m.winnerId); t(targets[1], slot, m.loserId);
            }
        }

        function renderAll() {
            const r = (c, ids) => {
                const el = document.getElementById(c + '-container'); el.innerHTML = '';
                ids.forEach(id => {
                    const m = p2Matches.find(x => x.id === id);
                    const t1 = teams.find(t => t.id === m.team1Id) || {name:'?'};
                    const t2 = teams.find(t => t.id === m.team2Id) || {name:'?'};
                    const card = document.createElement('div'); card.className = 'match-card';
                    card.innerHTML = `<div class="match-header">${getLabel(id)}</div>
                        <div class="match-team"><span class="team-name ${m.winnerId===m.team1Id?'team-winner':''}">${t1.name}</span>
                        <div class="team-score"><input type="number" value="${m.score1??''}" onchange="updateScore('${id}',1,this.value)"></div></div>
                        <div class="match-team"><span class="team-name ${m.winnerId===m.team2Id?'team-winner':''}">${t2.name}</span>
                        <div class="team-score"><input type="number" value="${m.score2??''}" onchange="updateScore('${id}',2,this.value)"></div></div>`;
                    el.appendChild(card);
                });
            };
            r('qf-p',['QF1','QF2','QF3','QF4']); r('sf-p',['SF1','SF2','SF3','SF4']); r('f-p',['F1','F2','F3','F4']);
            r('qf-c',['QF5','QF6','QF7','QF8']); r('sf-c',['SF5','SF6','SF7','SF8']); r('f-c',['F5','F6','F7','F8']);
        }

        function getLabel(id) {
            const labels = { F1:'Finale (1-2)', F2:'3e place', F3:'5e place', F4:'7e place', F5:'9e place', F6:'11e place', F7:'13e place', F8:'15e place', SF1:'Demi 1-4', SF2:'Demi 1-4', SF3:'Demi 5-8', SF4:'Demi 5-8', SF5:'Demi 9-12', SF6:'Demi 9-12', SF7:'Demi 13-16', SF8:'Demi 13-16' };
            return labels[id] || id;
        }

        function finishTournament() {
            if (p2Matches.every(m => m.completed || !m.team1Id)) {
                localStorage.setItem('tournamentStatus', 'TERMINÉ');
                alert("Tournoi terminé !");
                window.location.href = 'football-tournament-manager.html';
            } else alert("Complétez tous les scores.");
        }
    </script>
</body>
</html>
