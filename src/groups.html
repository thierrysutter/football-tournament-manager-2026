<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composition des Poules - FTM 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-divider: #dcd9d5;
            --color-border: #d4d1ca; --color-text: #28251d; --color-text-muted: #6b6965;
            --color-primary: #01696f; --color-primary-hover: #0c4e54;
            --radius-md: 0.5rem; --radius-lg: 0.75rem; --font-body: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); line-height: 1.5; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header { margin-bottom: 32px; }
        .page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
        .page-subtitle { color: var(--color-text-muted); margin-top: 4px; font-size: 14px; }
        nav ul { display: flex; gap: 6px; list-style: none; margin-top: 16px; flex-wrap: wrap; }
        nav ul a { text-decoration: none; color: var(--color-text-muted); padding: 5px 12px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; transition: 150ms; }
        nav ul a:hover { background: var(--color-divider); color: var(--color-text); }
        nav ul a.active { background: var(--color-primary); color: white; }
        .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
        .action-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 9px 18px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; border: none; font-size: 13px; transition: 150ms; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--color-primary); color: white; }
        .btn-primary:hover { background: var(--color-primary-hover); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-secondary { background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text); }
        .btn-secondary:hover { background: var(--color-divider); }
        .groups-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .group-box { background: white; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 16px; }
        .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .group-title { font-weight: 700; font-size: 15px; }
        .group-count { font-size: 12px; color: var(--color-text-muted); }
        .teams-list { display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
        .team-chip { padding: 8px 10px; background: rgba(1,105,111,0.06); border: 1px solid rgba(1,105,111,0.15); border-radius: 6px; font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
        .team-chip button { background: none; border: none; color: var(--color-text-muted); cursor: pointer; padding: 2px 5px; border-radius: 3px; font-size: 12px; }
        .team-chip button:hover { background: rgba(161,44,123,0.1); color: #a12c7b; }
        .unassigned-section { margin-bottom: 20px; }
        .unassigned-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; padding: 12px; background: white; border: 1px dashed var(--color-border); border-radius: var(--radius-md); }
        .unassigned-chip { padding: 6px 10px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
        .unassigned-chip .actions { display: flex; gap: 2px; }
        .unassigned-chip .actions button { width: 20px; height: 20px; border: none; background: var(--color-primary); color: white; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: 700; }
        .unassigned-chip .actions button:hover { background: var(--color-primary-hover); }
        .footer-actions { display: flex; justify-content: space-between; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--color-divider); }
        .empty-msg { text-align: center; color: var(--color-text-muted); font-size: 13px; padding: 20px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1 class="page-title">Composition des Poules</h1>
        <p class="page-subtitle" id="subtitle">—</p>
        <nav>
            <ul>
                <li><a href="../index.html">← Config</a></li>
                <li><a href="teams.html">Équipes</a></li>
                <li><a href="groups.html" class="active">Poules</a></li>
                <li><a href="matches.html">Matchs</a></li>
                <li><a href="standings.html">Classements</a></li>
                <li><a href="brackets.html">Brackets</a></li>
            </ul>
        </nav>
    </header>

    <div class="card unassigned-section">
        <h2 class="card-title">Équipes à répartir <span id="unassignedCount" style="color:var(--color-primary)">16</span></h2>
        <div class="action-btns">
            <button class="btn btn-primary" id="randomBtn">↻ Répartition aléatoire</button>
            <button class="btn btn-secondary" id="resetBtn">✕ Réinitialiser</button>
        </div>
        <div class="unassigned-list" id="unassignedList"></div>
    </div>

    <div class="card">
        <h2 class="card-title">4 Poules de 4 équipes</h2>
        <div class="groups-grid" id="groupsGrid"></div>
    </div>

    <div class="footer-actions">
        <a href="teams.html" class="btn btn-secondary">← Retour</a>
        <button class="btn btn-primary" id="continueBtn" disabled>Valider et continuer →</button>
    </div>
</div>

<script>
const CONFIG_KEY = 'tournamentConfig';
const TEAMS_KEY = 'teams';
const GROUPS_KEY = 'groups';

let teams = [];
let groups = { A: [], B: [], C: [], D: [] };

function loadData() {
    const config = JSON.parse(localStorage.getItem(CONFIG_KEY));
    teams = JSON.parse(localStorage.getItem(TEAMS_KEY)) || [];
    const savedGroups = JSON.parse(localStorage.getItem(GROUPS_KEY));
    if (savedGroups) groups = savedGroups;
    if (config && config.name) {
        document.getElementById('subtitle').textContent = config.name + (config.date ? '  —  ' + new Date(config.date).toLocaleDateString('fr-FR') : '');
    }
}

function saveGroups() {
    localStorage.setItem(GROUPS_KEY, JSON.stringify(groups));
}

function render() {
    const assigned = new Set();
    ['A','B','C','D'].forEach(g => groups[g].forEach(id => assigned.add(id)));
    const unassigned = teams.filter(t => !assigned.has(t.id));

    // Unassigned
    document.getElementById('unassignedCount').textContent = unassigned.length;
    const ul = document.getElementById('unassignedList');
    ul.innerHTML = unassigned.length === 0 ? '<div class="empty-msg">Toutes les équipes sont réparties</div>' :
        unassigned.map(t => `
            <div class="unassigned-chip">
                <span>${escapeHtml(t.name)}</span>
                <div class="actions">
                    ${['A','B','C','D'].filter(g => groups[g].length < 4).map(g =>
                        `<button onclick="addToGroup(${t.id},'${g}')" title="Ajouter à ${g}">${g}</button>`
                    ).join('')}
                </div>
            </div>`).join('');

    // Groups
    const grid = document.getElementById('groupsGrid');
    grid.innerHTML = ['A','B','C','D'].map(g => {
        const gTeams = groups[g].map(id => teams.find(t => t.id === id)).filter(Boolean);
        return `
            <div class="group-box">
                <div class="group-header">
                    <span class="group-title">Poule ${g}</span>
                    <span class="group-count">${gTeams.length}/4</span>
                </div>
                <div class="teams-list">
                    ${gTeams.length === 0 ? '<div class="empty-msg">Vide</div>' :
                        gTeams.map(t => `
                            <div class="team-chip">
                                <span>${escapeHtml(t.name)}</span>
                                <button onclick="removeFromGroup(${t.id},'${g}')" title="Retirer">×</button>
                            </div>`).join('')}
                </div>
            </div>`;
    }).join('');

    // Continuer
    const allFull = ['A','B','C','D'].every(g => groups[g].length === 4);
    document.getElementById('continueBtn').disabled = !allFull;
}

window.addToGroup = function(teamId, groupName) {
    if (groups[groupName].length >= 4) return alert(`Poule ${groupName} complète`);
    groups[groupName].push(teamId);
    saveGroups();
    render();
};

window.removeFromGroup = function(teamId, groupName) {
    groups[groupName] = groups[groupName].filter(id => id !== teamId);
    saveGroups();
    render();
};

document.getElementById('randomBtn').addEventListener('click', () => {
    if (!confirm('Répartir les équipes aléatoirement ?')) return;
    groups = { A: [], B: [], C: [], D: [] };
    const shuffled = [...teams].sort(() => Math.random() - 0.5);
    shuffled.forEach((t, i) => {
        const g = ['A','B','C','D'][i % 4];
        groups[g].push(t.id);
    });
    saveGroups();
    render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('Réinitialiser toutes les poules ?')) return;
    groups = { A: [], B: [], C: [], D: [] };
    saveGroups();
    render();
});

document.getElementById('continueBtn').addEventListener('click', () => {
    window.location.href = 'matches.html';
});

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

if (teams.length !== 16) {
    alert('Il faut exactement 16 équipes. Retour à la gestion des équipes.');
    window.location.href = 'teams.html';
} else {
    loadData();
    render();
}
</script>
</body>
</html>
